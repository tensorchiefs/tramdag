name: CI

on:
  push:
    branches:
    - main
    - dev-*
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: 17 3 * * *

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.14'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - run: >-
        uv sync --no-default-groups --group test
        --python ${{ matrix.python-version }}

    - name: Tests
      shell: bash
      env:
        OMP_NUM_THREADS: '1'
        UV_NO_DEFAULT_GROUPS: '1'
      run: >-
        uv run pytest -q -n auto --cov
        ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '-m "not slow"' || '' }}

  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
      with:
        enable-cache: true

    - run: uv sync --no-default-groups

    - name: Diagrams are current
      env:
        UV_NO_DEFAULT_GROUPS: '1'
      run: |
        uv run --frozen python tools/gen_diagrams.py
        if ! git diff --exit-code docs/architecture.md; then
          echo "::error::docs/architecture.md is stale. Regenerate it with"
          echo "::error::  uv run python tools/gen_diagrams.py"
          exit 1
        fi
