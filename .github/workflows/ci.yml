name: CI

on:
  push:
    branches:
    - main
    - dev-*
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: 17 3 * * *

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.14'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - run: >-
        uv sync --no-default-groups --group test
        --python ${{ matrix.python-version }}

    - name: Tests
      shell: bash
      env:
        OMP_NUM_THREADS: '1'
        UV_NO_DEFAULT_GROUPS: '1'
      run: >-
        uv run pytest -q -n auto --cov
        ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '-m "not slow"' || '' }}
