# Docs: MkDocs site (guides, executed notebooks, API from the numpy
# docstrings) published per ref with mike — main at the site root as
# `latest`, every dev-* branch under its own version — plus one PDF of README,
# guides and executed notebooks typeset by pandoc + XeLaTeX, so the math is
# real math. The PDF is a convenience: its step is continue-on-error and the
# previous copy is republished when it fails.
name: docs
on:
  push:
    branches: [main, dev-*]
  workflow_dispatch:
permissions:
  contents: write   # mike pushes gh-pages
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REF: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        fetch-depth: 0   # mike reads and writes the gh-pages branch
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: true
    - run: uv sync --no-default-groups --group docs --group notebooks

    - name: PDF — README, guides and executed notebooks through pandoc + XeLaTeX
      continue-on-error: true
      timeout-minutes: 25
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex texlive-latex-recommended texlive-fonts-recommended lmodern fonts-dejavu-core
        curl -sSL --max-time 120 --retry 2 -o /tmp/pandoc.deb \
          https://github.com/jgm/pandoc/releases/download/3.5/pandoc-3.5-1-amd64.deb
        sudo dpkg -i /tmp/pandoc.deb
        mkdir -p build/pdf/nb
        # every input is staged through the same two rewrites:
        #   badges  -- noise in a PDF, and a remote .svg badge makes pandoc emit
        #              \includesvg, which needs inkscape and fails the build
        #   [x][ref] -- mkdocstrings cross-references. The site resolves them;
        #              pandoc prints them raw, and the reference is one long
        #              unbreakable token that overflows its table column. The
        #              visible half already carries its own backticks.
        stage() {
          sed -E -e 's#\[!\[[^]]*\]\([^)]*\)\]\([^)]*\)##g' \
                 -e 's#!\[[^]]*\]\(https?://[^)]*\)##g' \
                 -e 's#\[([^]]+)\]\[[^]]+\]#\1#g' "$1" > "$2"
        }
        stage README.md build/pdf/README.md
        # architecture.md and adr/001 are deliberately absent: both are mostly
        # mermaid fences, which the site renders and pandoc prints as raw code
        for d in model notation interpretation fitting training-speed scores \
                 varying-coefficients paper-replication code-map zuko-upstream; do
          stage "docs/$d.md" "build/pdf/$d.md"
        done
        for n in demo_tram_dag_colab training_strategies additive_vs_joint_ci \
                 varying_coefficients classical_fit_tram_dag; do
          uv run jupytext --to notebook --execute --output "build/pdf/nb/$n.ipynb" "notebooks/$n.py"
          uv run jupyter nbconvert --to markdown "build/pdf/nb/$n.ipynb" --output "$n" --output-dir build/pdf/nb
          stage "build/pdf/nb/$n.md" "build/pdf/nb/$n.staged" && mv "build/pdf/nb/$n.staged" "build/pdf/nb/$n.md"
        done
        # pandoc's own `markdown` reader, not `gfm`: only it derives the table
        # column widths from the separator row, so a wide table wraps inside
        # p{} columns instead of running off the page in l columns
        pandoc -f markdown+tex_math_dollars --pdf-engine=xelatex \
          --resource-path=.:docs:build/pdf:build/pdf/nb -V mainfont="DejaVu Serif" -V monofont="DejaVu Sans Mono" \
          -V geometry:margin=2.2cm --toc --toc-depth=2 --metadata title="tramdag documentation" \
          build/pdf/README.md build/pdf/model.md build/pdf/notation.md build/pdf/interpretation.md \
          build/pdf/fitting.md build/pdf/training-speed.md build/pdf/scores.md \
          build/pdf/varying-coefficients.md build/pdf/paper-replication.md \
          build/pdf/code-map.md build/pdf/zuko-upstream.md build/pdf/nb/*.md \
          -o docs/tramdag-docs.pdf

    - name: keep the previous PDF when this build produced none
      run: |
        set -euo pipefail
        if [ ! -f docs/tramdag-docs.pdf ]; then
          dir="$REF"   # mike's latest alias is a symlink git show cannot traverse
          # a warning, not a silent republish: the step before is
          # continue-on-error, so without this a permanently broken PDF build
          # hides behind a green job and the site serves a stale document
          git show "origin/gh-pages:$dir/tramdag-docs.pdf" > docs/tramdag-docs.pdf 2>/dev/null \
            && echo "::warning::the PDF build failed; republishing the previous, now stale PDF" \
            || echo "::warning::the PDF build failed and there is none to republish"
        fi

    - name: build and publish the site version for this ref
      env:
        DOCS_EXECUTE: 'true'
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ "$REF" = main ]; then
          uv run mike deploy --push --update-aliases main latest
          uv run mike set-default --push latest
        else
          uv run mike deploy --push "$REF"
        fi
