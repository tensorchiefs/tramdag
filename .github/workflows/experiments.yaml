name: experiments

on:
  push:
  workflow_dispatch:
    inputs:
      script:
        description: run only this script (empty = all)
        required: false
        default: ''
      variant:
        description: run only this variant (needs script)
        required: false
        default: ''

concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
      with:
        enable-cache: true
    - id: pick
      working-directory: experiments
      env:
        UV_NO_DEFAULT_GROUPS: '1'
        ONLY_SCRIPT: ${{ inputs.script }}
        ONLY_VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        uv run --group experiments python - >> "$GITHUB_OUTPUT" <<'EOF'
        import json, os, pathlib, yaml

        only_script = os.environ.get("ONLY_SCRIPT", "")
        only_variant = os.environ.get("ONLY_VARIANT", "")
        if bool(only_script) != bool(only_variant):
            raise SystemExit(
                "narrowing the run needs both inputs: "
                f"script={only_script!r} variant={only_variant!r}"
            )
        include = []
        for path in sorted(pathlib.Path(".").glob("*.yaml")):
            script = path.stem
            document = yaml.safe_load(path.read_text()) or {}
            for variant in sorted(document.get("variants", ())):
                if only_script and (script, variant) != (only_script, only_variant):
                    continue
                include.append({"script": script, "variant": variant})
        if not include:
            raise SystemExit(
                f"no experiment matches script={only_script!r} variant={only_variant!r}"
            )
        print("include=" + json.dumps(include))
        EOF

  replicate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      UV_NO_DEFAULT_GROUPS: '1'
      OMP_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
      with:
        enable-cache: true

    - name: run the experiment
      working-directory: experiments
      run: >-
        uv run --group experiments python -m
        ${{ matrix.script }} ${{ matrix.variant }}

    - name: name the result directory
      id: result
      run: |
        set -euo pipefail
        script="${{ matrix.script }}"
        echo "name=${script//_/-}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"

    - name: check the metrics against the committed ground truth
      working-directory: experiments
      run: >-
        uv run --group experiments python -m check
        ${{ steps.result.outputs.name }}

    - if: always() && hashFiles(format('experiments/results/{0}/report.md', steps.result.outputs.name)) != ''
      name: post the report as a commit comment
      uses: iterative/setup-cml@e5f9f4673e0a8f275c45cc66dbbfd29c8469fb4e # v2.1.0
      with:
        vega: false
    - if: always() && hashFiles(format('experiments/results/{0}/report.md', steps.result.outputs.name)) != ''
      working-directory: >-
        experiments/results/${{ steps.result.outputs.name }}
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        cml comment create --target=commit report.md
