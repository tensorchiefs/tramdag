repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-executables-have-shebangs
  - id: check-merge-conflict
  - id: check-shebang-scripts-are-executable
  - id: check-toml
  - id: check-yaml
    args: [--unsafe]
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
  - id: pretty-format-toml
    args: [--autofix]
    exclude: ^uv\.lock$

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  - id: codespell
    name: codespell (tracked files)
    args: [-L, 'nd,continous,lik']
    exclude: ^(experiments/.*/data/|uv\.lock|.*\.ipynb$|.*texfrag/)
  - id: codespell
    alias: codespell-commit-msg
    name: codespell (commit message)
    args: [-L, 'nd,continous,lik']
    stages: [commit-msg]

- repo: https://github.com/rohaquinlop/complexipy-pre-commit
  rev: v8.3.0
  hooks:
  - id: complexipy
    alias: complexipy-src
    name: complexipy (src + tools, max 15)
    args: [--max-complexity-allowed, '15']
    files: ^(src|tools)/
  - id: complexipy
    alias: complexipy-examples
    name: complexipy (experiments/notebooks/tests, max 10)
    args: [--max-complexity-allowed, '10']
    files: ^(experiments|notebooks|tests)/
    exclude: \.ipynb$

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.7
  hooks:
  - id: uv-lock

- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.19.3
  hooks:
  - id: commitizen
    stages: [commit-msg]

- repo: local
  hooks:
  - id: replications
    name: replications match the ground truth
    entry: uv run --no-sync python experiments/replicate.py
    language: system
    files: ^(src/|experiments/|uv\.lock$)
    pass_filenames: false
    require_serial: true
    stages: [pre-push]
  - id: no-agent-attribution
    name: no agent attribution in the commit message
    entry: (?i)^(co-authored-by|assisted-by|generated-by|claude-session):|generated with
    language: pygrep
    stages: [commit-msg]
  - id: vale-commit-msg
    name: vale (commit message)
    entry: vale
    language: python
    additional_dependencies: [vale==3.26.0.1]
    stages: [commit-msg]
  - id: tests-do-not-import-experiments
    name: tests never import experiments
    entry: ^\s*(from|import)\s+experiments\b
    language: pygrep
    files: ^tests/.*\.py$
  - id: frozen-experiment-data
    name: experiments/data takes new folders only, no edits
    entry: git diff --cached --quiet --diff-filter=MDR -- experiments/data/
    language: system
    files: ^experiments/data/
    pass_filenames: false
  - id: section-markers
    name: module sections use the eight names of CONTRIBUTING.md
    entry: ^# %%(?! (imports|global variables|private functions|public functions|private classes|public classes|alias|main) -+$)
    language: pygrep
    files: ^(src|tools|tests|experiments)/.*\.py$
  - id: no-python-comments
    name: python carries no comments
    entry: python tools/check_comments.py
    language: python
    types: [python]
  - id: no-config-comments
    name: config files carry no comments
    entry: (^|\s)#(?! v\d+\.\d+\.\d+$)
    language: pygrep
    files: ^(pyproject\.toml|\.pre-commit-config\.yaml|mkdocs\.yml|\.github/workflows/.*\.ya?ml)$
  - id: no-experiment-yaml-comments
    name: experiment yaml carries only the dag line
    entry: (^|\s)#(?!\s\w+ ~ )
    language: pygrep
    files: ^experiments/[^/]+\.ya?ml$
  - id: error-message-style
    name: error messages start lowercase, no trailing period
    entry: raise \w+\(f?"([A-Z][a-z]* |(?![^"]*\. )[^"]*\."\))
    language: pygrep
    files: ^src/.*\.py$
  - id: vale
    name: vale (docs prose)
    entry: vale
    language: python
    additional_dependencies: [vale==3.26.0.1]
    require_serial: true
    types: [markdown]
    exclude: ^CHANGELOG\.md$
  - id: pymarkdown
    name: prose lines of at most 80 columns
    entry: pymarkdown scan
    language: python
    additional_dependencies: [pymarkdownlnt==0.9.41]
    types: [markdown]
    exclude: ^CHANGELOG\.md$
