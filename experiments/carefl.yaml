variants:
  flexible:
    n_val: 5000
    flow_kwargs:
      seed: 7
      init: glorot
    marginal_init: false
    fit_kwargs:
      epochs: 7000
      batch_size: 2500
      seed: 0
    learning_rate: 0.001
    schedule: plateau
    plateau_patience: 50
    plateau_factor: 0.1
    plateau_min_lr: 1.0e-7
    min_delta: 0.0
    dgp_seed: 42
    n_heldout: 300
    heldout_seed_offset: 999
    alphas_scored: [-1.5, 0.0, 1.5]
    figures:
      dag.png:
        title: 'CAREFL: the DAG, complex intercepts on x3 and x4'
        caption: The model as declared, one edge per term, labelled by the term that owns it.
      training.png:
        title: 'CAREFL: training (val = train, as in the reference)'
        caption: Summed NLL per epoch under the reference's plateau rule, applied per node (D5).
      marginals.png:
        title: 'CAREFL: observed vs sampled marginals'
        caption: CAREFL's committed rows against a sample of the fitted flow, in sd-standardized units.
      cf_curves.png:
        title: "CAREFL counterfactual queries at $x_{{obs}}$ = ({x_obs})\n(Fig. 6; x3/x4 in CAREFL's sd-standardized units)"
        caption: Both counterfactual curves at the committed observation against the analytic truth and CAREFL's own predictions; the fig6_* metrics are the largest gaps.
    spec:
      # x4 ~ CI(x1, x2)
      x1:
        kind: continuous
        terms:
        - {term: I, parents: [], options: {transform: bernstein, transform_kwargs: {n_coeffs: 31, range_q: 0.0}}}
      x2:
        kind: continuous
        terms:
        - {term: I, parents: [], options: {transform: bernstein, transform_kwargs: {n_coeffs: 31, range_q: 0.0}}}
      x3:
        kind: continuous
        terms:
        - {term: I, parents: [x1, x2], options: {transform: bernstein, transform_kwargs: {n_coeffs: 31, range_q: 0.0}, units: [10, 100], activation: tanh, input_transform: minmax, batch_norm: false, allow_interaction: true}}
      x4:
        kind: continuous
        terms:
        - {term: I, parents: [x1, x2], options: {transform: bernstein, transform_kwargs: {n_coeffs: 31, range_q: 0.0}, units: [10, 100], activation: tanh, input_transform: minmax, batch_norm: false, allow_interaction: true}}
