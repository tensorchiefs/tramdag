paper_protocol: &paper_protocol
  n_train: 40000
  n_val: 40000
  flow_kwargs:
    seed: 7
    init: normal
  marginal_init: true
  fit_kwargs:
    epochs: 300
    batch_size: 256
    seed: 0
  learning_rate: 0.004
  schedule:
  dgp_seed: 42
  sample_seed: 0
  n_compare: 10000
  do_x1: -1.0
  grid_low: -1.0
  grid_high: 1.0
  grid_points: 81
  figures:
    dag.png:
      title: 'triangle/{f}: the DAG, {shift} shift on x2 -> x3'
      caption: The model as declared, one edge per term, labelled by the term that owns it.
    training.png:
      title: 'triangle/{f}, {shift} model: training'
      caption: Summed train NLL per epoch; the fit keeps the final weights.
    marginals.png:
      title: 'triangle/{f}, {shift} model: observed vs sampled marginals'
      caption: The validation rows against a sample of the fitted flow, one panel per node.
    coefficients.png:
      title: 'triangle/{f}, {shift} model: linear-shift coefficients'
      caption: The linear-shift weights after every epoch, dashed at the DGP truth.
    cs_curve.png:
      title: 'complex shift, DGP f = {f}: fitted vs $-f(x_2)$'
      caption: The fitted x2 -> x3 complex shift against the DGP's -f(x2), both anchored at the grid's middle point; cs_curve_max_abs_err is the largest gap.
    distributions.png:
      title: 'triangle/{f}, {shift} model: L1/L2'
      caption: Observational and do(x1) samples per variable, DGP filled and flow stepped; the do(x1) mean of x3 is the metric.

x1: &x1
  kind: continuous
  terms:
  - {term: I, parents: [], options: {transform: bernstein, transform_kwargs: {n_coeffs: 20}}}

x2: &x2
  kind: continuous
  terms:
  - {term: I, parents: [], options: {transform: bernstein, transform_kwargs: {n_coeffs: 20}}}
  - {term: LS, parents: [x1], options: {}}

x3_ls: &x3_ls
  kind: continuous
  terms:
  - {term: I, parents: [], options: {transform: bernstein, transform_kwargs: {n_coeffs: 20}}}
  - {term: LS, parents: [x1], options: {}}
  - {term: LS, parents: [x2], options: {}}

x3_cs: &x3_cs
  kind: continuous
  terms:
  - {term: I, parents: [], options: {transform: bernstein, transform_kwargs: {n_coeffs: 20}}}
  - {term: LS, parents: [x1], options: {}}
  - {term: CS, parents: [x2], options: {units: [25, 25], activation: sigmoid, batch_norm: false, input_transform: null}}

variants:
  linear-ls:
    <<: *paper_protocol
    f: linear
    shift: ls
    spec:
      # x3 ~ SI() + LS(x1) + LS(x2)
      x1: *x1
      x2: *x2
      x3: *x3_ls

  linear-cs:
    <<: *paper_protocol
    f: linear
    shift: cs
    marginal_init: false
    fit_kwargs:
      epochs: 500
      batch_size: 256
      seed: 0
    spec:
      # x3 ~ SI() + LS(x1) + CS(x2)
      x1: *x1
      x2: *x2
      x3: *x3_cs

  atan-cs:
    <<: *paper_protocol
    f: atan
    shift: cs
    spec:
      # x3 ~ SI() + LS(x1) + CS(x2)
      x1: *x1
      x2: *x2
      x3: *x3_cs

  sin-cs:
    <<: *paper_protocol
    f: sin
    shift: cs
    marginal_init: false
    grid_low: -1.0
    grid_high: 0.0
    spec:
      # x3 ~ SI() + LS(x1) + CS(x2)
      x1: *x1
      x2: *x2
      x3: *x3_cs
