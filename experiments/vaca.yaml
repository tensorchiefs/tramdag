variants:
  flexible:
    n_train: 2500
    n_val: 5000
    flow_kwargs:
      seed: 7
      init: glorot
    marginal_init: false
    fit_kwargs:
      epochs: 10000
      batch_size: 2500
      seed: 0
    learning_rate: 0.001
    schedule: plateau
    plateau_patience: 50
    plateau_factor: 0.1
    plateau_min_lr: 1.0e-7
    min_delta: 0.0
    dgp_seed: 42
    sample_seed: 1
    n_compare: 50000
    n_scatter: 2000
    hist_bins: 60
    figures:
      dag.png:
        title: 'VACA triangle: the DAG, complex intercepts on x2 and x3'
        caption: The model as declared, one edge per term, labelled by the term that owns it.
      training.png:
        title: 'VACA triangle: training'
        caption: Summed train and validation NLL per epoch under the reference's plateau rule, applied per node (D5).
      marginals.png:
        title: 'VACA triangle: observed vs sampled marginals'
        caption: The validation rows against a sample of the fitted flow, one panel per node.
      pairs.png:
        title: 'VACA triangle: observational joint, DGP vs flow (Fig. 4)'
        caption: Marginals on the diagonal, scatters off it; the bimodal source is what the default CNF misses.
      interventional.png:
        title: 'VACA triangle: interventional distributions (Fig. 5)'
        caption: p(x3 | do(x2)) for the three intervention values, DGP against flow; the mean errors are the metrics.
    spec:
      # x3 ~ CI(x1, x2)
      x1:
        kind: continuous
        terms:
        - {term: I, parents: [], options: {transform: bernstein, transform_kwargs: {n_coeffs: 31, range_q: 0.05}}}
      x2:
        kind: continuous
        terms:
        - {term: I, parents: [x1], options: {transform: bernstein, transform_kwargs: {n_coeffs: 31, range_q: 0.05}, units: [10, 100], activation: tanh, input_transform: minmax, batch_norm: false}}
      x3:
        kind: continuous
        terms:
        - {term: I, parents: [x1, x2], options: {transform: bernstein, transform_kwargs: {n_coeffs: 31, range_q: 0.05}, units: [10, 100], activation: tanh, input_transform: minmax, batch_norm: false, allow_interaction: true}}
