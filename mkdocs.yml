site_name: tramdag
site_description: Interpretable Neural Causal Models (TRAM-DAGs) in PyTorch
site_url: https://tensorchiefs.github.io/tramdag/
repo_url: https://github.com/tensorchiefs/tramdag
edit_uri: blob/main/
docs_dir: docs
strict: true
exclude_docs: |
  __pycache__/
  *.pyc

theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, toc.follow]
  palette:
  - scheme: default
    toggle: {icon: material/brightness-7, name: dark mode}
  - scheme: slate
    toggle: {icon: material/brightness-4, name: light mode}

nav:
- Home: index.md
- Guides:
  - The model: model.md
  - Notation: notation.md
  - Interpretation: interpretation.md
  - Fitting: fitting.md
  - Scores: scores.md
  - Varying coefficients: varying-coefficients.md
  - Paper replication: paper-replication.md
  - Architecture: architecture.md
  - Code map: code-map.md
  - Zuko upstream: zuko-upstream.md
  - References: references.md
- Notebooks:
  - Introduction and demo (Colab): notebooks/demo_tram_dag_colab.py
  - Training strategies: notebooks/training_strategies.py
  - Per-node or joint fit: notebooks/fit_strategies_benchmark.py
  - Additive vs joint intercepts: notebooks/additive_vs_joint_ci.py
  - Varying coefficients: notebooks/varying_coefficients.py
  - Classical fitting: notebooks/classical_fit_tram_dag.py
- API:
  - tramdag: api/tramdag.md
  - spec: api/spec.md
  - flow: api/flow.md
  - modules: api/modules.md
  - nodes: api/nodes.md
  - fitting: api/fitting.md
  - readouts: api/readouts.md
  - transforms: api/transforms.md
  - scores: api/scores.md
  - callbacks: api/callbacks.md
  - plots: api/plots.md

hooks: [docs/hooks.py]

plugins:
- search
- bibtex:
    bib_file: docs/references.bib
    csl_file: docs/apa.csl
- autorefs
- mkdocstrings:
    handlers:
      python:
        paths: [src]
        options:
          docstring_style: numpy
          show_source: true
          members_order: source
          show_root_heading: true
          separate_signature: true
          scoped_crossrefs: true
          relative_crossrefs: true
- mkdocs-jupyter:
    include: ['*.py']
    ignore: [hooks.py]
    execute: false
    allow_errors: false
    include_source: true

markdown_extensions:
- admonition
- footnotes
- smarty: {smart_quotes: false, smart_angled_quotes: false, smart_ellipses: false}
- tables
- toc: {permalink: true}
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.arithmatex: {generic: true}

extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  version: {provider: mike}
