[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
dev = [
  { include-group = "docs" },
  { include-group = "experiments" },
  { include-group = "notebooks" },
  { include-group = "test" },
  "pre-commit",
  "pylsp-rope",
  "ruff==0.16.9",
  "shellcheck-py",
  "python-lsp-ruff",
  "python-lsp-server[all]"
]
docs = [
  "mkdocs-material",
  "mkdocs-autorefs",
  "mkdocstrings[python]",
  "mkdocs-jupyter",
  "mike",
  "nbconvert",
  "mkdocs-bibtex",
  "pypandoc-binary"
]
experiments = [
  "matplotlib",
  "pyyaml",
  "scipy",
  "statsmodels"
]
notebooks = [
  "jupytext",
  "ipykernel",
  "matplotlib",
  "scipy",
  "statsmodels"
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "matplotlib",
  "pyyaml",
  "scipy",
  "statsmodels"
]

[project]
authors = [
  { name = "Oliver Dürr", email = "oliver.duerr@gmail.com" },
  { name = "Beate Sick" },
  { name = "Marcel Arpogaus" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "zuko>=1.3",
  "torch>=2.0",
  "numpy",
  "pandas"
]
description = "Interpretable Neural Causal Models (TRAM-DAGs) in PyTorch: one causal normalizing flow for observational, interventional and counterfactual queries"
dynamic = ["version"]
keywords = [
  "causal-inference",
  "normalizing-flows",
  "transformation-models",
  "counterfactuals",
  "structural-causal-models",
  "interpretability"
]
license = "MIT"
license-files = ["LICENSE"]
name = "tramdag"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
plots = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/tensorchiefs/tramdag"
"Method paper (CLeaR 2025)" = "https://arxiv.org/abs/2503.16206"
"Stroke case study" = "https://arxiv.org/abs/2606.12623"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "scm"
version_scheme = "pep440"

[tool.coverage.report]
fail_under = 95

[tool.coverage.run]
source = ["src/tramdag"]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/tramdag"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.pymarkdown]
extensions.markdown-tables.enabled = true
plugins.md013.code_blocks = false
plugins.md013.enabled = true
plugins.md013.headings = false
plugins.md013.tables = false
plugins.selectively_enable_rules = true

[tool.pytest.ini_options]
addopts = ["-v", "--tb=short"]
markers = [
  "slow: long fit/training tests — excluded from PR CI, run in the nightly full suite"
]
pythonpath = ["experiments"]
testpaths = ["tests", "experiments"]

[tool.ruff]
indent-width = 4
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "I",
  "E",
  "D",
  "UP",
  "B",
  "C4",
  "C90",
  "NPY",
  "PERF",
  "PT",
  "RUF",
  "SIM",
  "A",
  "DTZ",
  "FURB",
  "G",
  "ICN",
  "ISC",
  "LOG",
  "PIE",
  "PLW1641",
  "PTH",
  "RET"
]
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
  "C408",
  "SIM108"
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"**/notebooks/*" = ["D100", "D103", "D205", "D401", "E501"]
"experiments/*" = ["D103"]
"tests/*" = ["D103", "D205", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
